name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Provide production runtime configuration
        env:
          WEBSCRAPER_CONFIG_JS_B64: ${{ secrets.WEBSCRAPER_CONFIG_JS_B64 }}
        run: |
          test -n "$WEBSCRAPER_CONFIG_JS_B64"
          printf '%s' "$WEBSCRAPER_CONFIG_JS_B64" | base64 --decode > config.js
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Install Chromium for Pages startup checks
        run: npx playwright install --with-deps chromium
      - name: Verify Pages startup at root and repository paths
        run: npm run test:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
